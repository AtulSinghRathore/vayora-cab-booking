# Vayora fare configuration
# Edit these values without changing application code.

currency=INR
booking.fee=99

# Fixed full-day cab charge by vehicle type
vehicle.go.baseDayFare=1300
vehicle.plus.baseDayFare=1600
vehicle.xl.baseDayFare=2200

# Fuel and running charge per kilometre by vehicle type
vehicle.go.perKm=13
vehicle.plus.perKm=15
vehicle.xl.perKm=20

# Driver charges
driver.dayAllowance=350
driver.overnightStay=800

# Distance calculation
distance.roadFactor=1.18
distance.minimumKm=20

# GST for passenger transport where fuel is included.
# Confirm the applicable GST/ITC treatment with your tax adviser.
gst.percent=5
